name: Vérifications macOS

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Vérifier le calcul des versions
        run: python3 scripts/test-version.py
      - name: Tester l’application
        run: zsh scripts/test.sh
      - name: Compiler pour Apple Silicon et Intel
        run: zsh scripts/build-app.sh --arch arm64 --arch x86_64
      - name: Créer et vérifier le DMG
        run: zsh scripts/build-dmg.sh
      - name: Conserver le DMG de test
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SonicSwitch-preview-${{ github.run_id }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
